# Xcode project definition. The generated FileFlipper.xcodeproj is committed, so you
# only need XcodeGen (brew install xcodegen) if you change this file: run `xcodegen`.
name: FileFlipper
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.5.0
    CURRENT_PROJECT_VERSION: 8
    SWIFT_VERSION: "5.0"
targets:
  FileFlipper:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Sources/FileFlipper
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: FileFlipper
        PRODUCT_BUNDLE_IDENTIFIER: com.aimeesun.fileflipper
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/FileFlipper.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
