# SwiftLint for CI. Only rules that catch real mistakes are errors; style rules are off so the
# existing code style stays as it is. Run locally with: swiftlint lint --strict
included:
  - Sources
  - Tests
disabled_rules:
  - line_length
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - large_tuple
  - nesting
  - type_name
  - todo
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure
  - for_where
  - vertical_parameter_alignment
  - statement_position
  - comma
  - colon
  - force_cast
  - force_try
  - inclusive_language            # "slide master" is PowerPoint's own term
  - implicit_optional_initialization
  - shorthand_operator
  - optional_data_string_conversion
opt_in_rules:
  - empty_count
