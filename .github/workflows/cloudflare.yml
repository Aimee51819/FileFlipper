# Publishes FileFlipper on Cloudflare, which (unlike GitHub's servers) is reachable from mainland China:
#   - mirror: copies the latest GitHub release into the R2 bucket behind dl.fileflipper.app
#   - deploy: deploys the Worker that serves the website (docs/) and the downloads
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token template, scoped to
# the account and the fileflipper.app zone) and CLOUDFLARE_ACCOUNT_ID. R2 must be enabled in the dashboard.
#
# After a release (called from release.yml) or by hand: mirror + deploy.
# When the website or the Worker changes: deploy only.
name: Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "cloudflare/**"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BUCKET: fileflipper-downloads

jobs:
  mirror:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Create the R2 bucket if needed
        run: |
          wrangler r2 bucket list 2>&1 | tee -a wrangler.log
          if grep -q "$BUCKET" wrangler.log; then
            echo "Bucket $BUCKET exists"
          else
            wrangler r2 bucket create "$BUCKET" 2>&1 | tee -a wrangler.log
          fi

      - name: Download the latest release from GitHub
        run: |
          mkdir dist
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*" --dir dist 2>&1 | tee -a wrangler.log
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt,assets > release.json
          ls -l dist

      - name: Upload to R2
        run: |
          tag=$(jq -r .tagName release.json)
          for file in dist/*; do
            name=$(basename "$file")
            case "$name" in
              *.zip) type=application/zip ;;
              *.exe) type=application/vnd.microsoft.portable-executable ;;
              *) type=application/octet-stream ;;
            esac
            # The versioned copy stays forever; the plain name always points to the latest release.
            wrangler r2 object put "$BUCKET/$tag/$name" --file "$file" --content-type "$type" --remote 2>&1 | tee -a wrangler.log
            wrangler r2 object put "$BUCKET/$name" --file "$file" --content-type "$type" --remote 2>&1 | tee -a wrangler.log
          done
          jq '{version: (.tagName | ltrimstr("v")), tag: .tagName, published: .publishedAt,
               files: (.assets | map({key: .name, value: {size: .size}}) | from_entries)}' release.json > latest.json
          cat latest.json
          wrangler r2 object put "$BUCKET/latest.json" --file latest.json --content-type "application/json; charset=utf-8" --remote 2>&1 | tee -a wrangler.log

      # Logs need a GitHub login to read; an annotation shows Wrangler's error on the public run page.
      - name: Report the Wrangler error
        if: failure()
        run: |
          msg=$(tail -n 30 wrangler.log 2>/dev/null | grep -v '^\s*$' | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
          echo "::error title=Wrangler::${msg:-no output}"

  deploy:
    needs: mirror
    # Runs after the mirror, or on its own when the mirror is skipped (pushes).
    if: always() && (needs.mirror.result == 'success' || needs.mirror.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy the Worker (website + downloads)
        working-directory: cloudflare
        run: wrangler deploy 2>&1 | tee -a ../wrangler.log

      - name: Check the site and downloads
        run: |
          sleep 20
          for url in https://fileflipper.app/ https://dl.fileflipper.app/latest.json https://dl.fileflipper.app/FileFlipper.zip; do
            echo "$url -> $(curl -s -o /dev/null -w "%{http_code}" -I "$url")"
          done

      - name: Report the Wrangler error
        if: failure()
        run: |
          msg=$(tail -n 30 wrangler.log 2>/dev/null | grep -v '^\s*$' | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
          echo "::error title=Wrangler::${msg:-no output}"
