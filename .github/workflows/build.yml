name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (sandboxed, ad-hoc signed)
        run: ./scripts/build-app.sh
      - name: Build with SwiftPM
        run: swift build -c release
      - name: Package
        run: cd build && ditto -c -k --keepParent FileFlipper.app FileFlipper.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FileFlipper
          path: build/FileFlipper.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FileFlipper-Windows
          path: build/windows/FileFlipper.exe
