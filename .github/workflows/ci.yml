# Continuous integration: lint, regression tests, and Mac + Windows builds.
#
# Runs on every pull request, on pushes to main / release/** / ci/**, by hand, and from release.yml
# (workflow_call with sign: true, which signs and notarizes when the signing secrets are set).
# Architecture and secrets: see CICD.md.
name: CI

on:
  push:
    branches: [main, "release/**", "ci/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sign:
        description: Sign (Developer ID / Authenticode) and notarize when the secrets are set
        type: boolean
        default: false
      version:
        description: Version to stamp into the Windows build (defaults to the csproj version)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Pull requests and branch pushes cancel older runs of the same ref; release builds never do.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.sign && 'release' || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/') }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version numbers agree
        run: ./scripts/version.sh check

      - name: Workflows (actionlint)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning scripts/*.sh scripts/ci/*.sh

      - name: Swift (SwiftLint)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/realm/swiftlint:0.65.1 swiftlint lint --strict --reporter github-actions-logging

  mac:
    name: macOS build + tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Xcode project matches project.yml
        # FileFlipper.xcodeproj is generated by XcodeGen and committed; this catches edits made to only one of them.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet
          git diff --exit-code -- FileFlipper.xcodeproj ||
            { echo "::error::FileFlipper.xcodeproj is out of date with project.yml. Run xcodegen and commit."; exit 1; }

      - name: Regression tests (swift test)
        run: swift test --parallel 2>&1 | tee build-test.log

      - name: Build app (Xcode, sandboxed, ad-hoc signed)
        run: ./scripts/build-app.sh

      - name: Build with SwiftPM (release)
        run: swift build -c release

      - name: Verify the app bundle
        run: ./scripts/ci/verify-mac-app.sh build/FileFlipper.app

      - name: Sign with Developer ID and notarize
        id: sign
        if: inputs.sign
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_DEVELOPER_ID_P12" ] || [ -z "$APP_STORE_CONNECT_API_KEY_P8" ]; then
            echo "::notice::Developer ID secrets not set; the Mac zip stays ad-hoc signed (same as before)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/ci/sign-mac.sh
          ./scripts/ci/verify-mac-app.sh build/FileFlipper.app --developer-id
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Remove signing material
        if: always() && inputs.sign
        run: ./scripts/ci/cleanup-signing.sh

      - name: Package
        run: cd build && ditto -c -k --keepParent FileFlipper.app FileFlipper.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: build/FileFlipper.zip
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-logs
          path: |
            build/xcodebuild.log
            build-test.log
          if-no-files-found: ignore

  windows:
    name: Windows build + smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: ./windows/build.ps1 -Version $env:VERSION

      - name: Authenticode-sign FileFlipper.exe
        id: sign
        if: inputs.sign
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX) {
            Write-Host "::notice::WINDOWS_SIGNING_PFX not set; the Windows build stays unsigned (same as before)."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build\windows\FileFlipper.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          "signed=true" >> $env:GITHUB_OUTPUT
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Package (zip + installer)
        env:
          VERSION: ${{ inputs.version }}
        run: ./windows/build.ps1 -Package -NoBuild -Version $env:VERSION

      - name: Authenticode-sign the installer
        if: steps.sign.outputs.signed == 'true'
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f (Join-Path $env:RUNNER_TEMP "signing.pfx") /p $env:WINDOWS_SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build\windows\FileFlipper-Windows-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

      - name: Remove signing material
        if: always() && inputs.sign
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "signing.pfx")

      - name: Smoke test (version, silent install, uninstall)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $expected = if ($env:VERSION) { $env:VERSION } else {
            ([xml](Get-Content windows/FileFlipper/FileFlipper.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          $exe = Get-Item build\windows\FileFlipper.exe
          $actual = $exe.VersionInfo.ProductVersion -replace '\+.*$', ''
          if ($actual -ne $expected) { throw "FileFlipper.exe version is $actual, expected $expected" }
          if ($exe.Length -lt 10MB) { throw "FileFlipper.exe is only $($exe.Length) bytes; the self-contained build looks broken" }
          foreach ($file in "FileFlipper-Windows.zip", "FileFlipper-Windows-Setup.exe") {
            if (-not (Test-Path "build\windows\$file")) { throw "Missing build\windows\$file" }
          }

          $setup = Start-Process build\windows\FileFlipper-Windows-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\FileFlipper"
          if (-not (Test-Path "$installed\FileFlipper.exe")) { throw "Installer did not install FileFlipper.exe" }
          $uninstall = Start-Process "$installed\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$installed\FileFlipper.exe") { throw "Uninstaller left FileFlipper.exe behind" }
          Write-Host "OK: FileFlipper $actual for Windows builds, installs and uninstalls."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            build/windows/FileFlipper-Windows-Setup.exe
            build/windows/FileFlipper-Windows.zip
          if-no-files-found: error
